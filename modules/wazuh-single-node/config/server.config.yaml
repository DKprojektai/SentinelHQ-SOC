version:
  name: "velociraptor"
  version: "0.75"

Client:
  server_urls:
    - https://VelociraptorServer:8000/
  ca_certificate: |
    -----BEGIN CERTIFICATE-----
    Generated by the config wizard!!!
    -----END CERTIFICATE-----
  nonce: "VelociraptorNonce001"
  writeback_linux: /velociraptor/config/client.writeback.yaml
  tempdir_linux: /tmp/
  max_poll: 60
  max_poll_std: 30
  use_self_signed_ssl: true
  pinned_server_name: VelociraptorServer

API:
  hostname: 0.0.0.0
  bind_address: 0.0.0.0
  bind_port: 8001
  bind_scheme: tcp
  pinned_gw_name: GRPC_GW

GUI:
  use_plain_http: false
  base_path: /
  bind_address: 0.0.0.0
  bind_port: 8889

Frontend:
  bind_address: 0.0.0.0
  bind_port: 8000
  hostname: VelociraptorServer
  require_client_certificates: false

Datastore:
  location: /velociraptor/config/datastore
  filestore_directory: /velociraptor/config/filestore

DB:
  implementation: sqlite
  location: /velociraptor/logs
  name: velociraptor.db

Logging:
  output_directory: /velociraptor/logs
  separate_logs_per_component: true
  level: INFO

Monitoring:
  bind_address: 127.0.0.1
  bind_port: 8003

# Inventory service - reikalingas MSI generavimui
Inventory:
  path: /velociraptor/config/inventory

# Tools - čia saugomi klientų binary failai
tools:
  - name: "VelociraptorWindows"
    url: "https://github.com/Velocidex/velociraptor/releases/download/v0.75.6/velociraptor-v0.75.6-windows-amd64.msi"
    serve_locally: true
  - name: "VelociraptorLinux"
    url: "https://github.com/Velocidex/velociraptor/releases/download/v0.75.6/velociraptor-v0.75.6-linux-amd64"
    serve_locally: true
  - name: "VelociraptorDarwin"
    url: "https://github.com/Velocidex/velociraptor/releases/download/v0.75.6/velociraptor-v0.75.6-darwin-amd64"
    serve_locally: true

defaults:
  artifact_definitions:
    - /velociraptor/config/artifacts